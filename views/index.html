<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNotes - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <nav class="bg-white border-b border-gray-200 fixed z-30 w-full top-0">
        <div class="px-6 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">
                    ☁️ CloudNotes
                </span>
                <span class="ml-3 px-2 py-0.5 text-xs font-semibold bg-green-100 text-green-800 rounded-full">DevOps Ready</span>
            </div>
            <div class="w-1/3">
                <input type="text" id="searchInput" placeholder="Search notes..." class="w-full px-4 py-2 bg-gray-100 border border-transparent rounded-lg focus:outline-none focus:bg-white focus:border-indigo-500 transition">
            </div>
        </div>
    </nav>

    <div class="flex pt-16 overflow-hidden h-screen">
        <aside class="w-80 bg-white border-r border-gray-200 p-6 flex-shrink-0 hidden md:block overflow-y-auto">
            <h2 class="text-xl font-bold text-gray-800 mb-6" id="formTitle">Create New Note</h2>
            <form id="noteForm" class="space-y-4">
                <input type="hidden" id="noteId">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Title</label>
                    <input type="text" id="title" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Category</label>
                    <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="General">General</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="DevOps">DevOps</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Content</label>
                    <textarea id="content" rows="6" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="submit" id="saveBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md shadow transition">Save Note</button>
                    <button type="button" id="cancelBtn" class="hidden w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-md transition">Cancel</button>
                </div>
            </form>
        </aside>

        <main class="flex-1 bg-gray-50 p-6 overflow-y-auto">
            <div id="notesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
