name: Code Quality
on:
    workflow_call:
        inputs:
            DOCKERHUB_USER:
                required: true
                type: string
            DOCKERHUB_TAG:
                required: true
                type: string
jobs:
    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node app
              uses: actions/setup-node@v4
              with:
                 node-version: '22'
                 cache: 'npm'
                 cache-dependency-path: '**/package-lock.json'
            
            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint
              
            - name: Check Formatting
              run: npm run format:check

            - name: Run Unit Tests
              run: npm test

            - name: Security Audit
              run: npm audit --audit-level=high