name: Build and Push Docker Image

on:
  workflow_call:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t cloudnotes:${{ github.sha }} .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudnotes:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
      - name: Tag Image
        run: |
          docker tag cloudnotes:${{ github.sha }} ${{ vars.DOCKERHUB_USER }}/cloudnotes:latest
          docker tag cloudnotes:${{ github.sha }} ${{ vars.DOCKERHUB_USER }}/cloudnotes:${{ github.ref_name }}
          docker tag cloudnotes:${{ github.sha }} ${{ vars.DOCKERHUB_USER }}/cloudnotes:${{ github.sha }}

      - name: Push Image
        run: |
          docker push ${{ vars.DOCKERHUB_USER }}/cloudnotes:latest
          docker push ${{ vars.DOCKERHUB_USER }}/cloudnotes:${{ github.ref_name }}
          docker push ${{ vars.DOCKERHUB_USER }}/cloudnotes:${{ github.sha }}